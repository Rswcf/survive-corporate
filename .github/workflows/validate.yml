name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SKILL.md frontmatter and counts
        run: python3 scripts/check_skill.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Claude Code plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict .
      - name: Validate Cursor manifests are well-formed JSON
        run: for f in .cursor-plugin/*.json; do python3 -m json.tool "$f" > /dev/null; done

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments --exclude 'star-history\.com' --exclude 'actions/workflows/' './**/*.md'
          fail: true
